<!doctype html>
<!-- Source of build/background.png (540×380) and background@2x.png. The window places the app at (140,190) and Applications at (400,190).
     Light and plain on purpose: Finder writes the icons' names in dark text, whatever the background. Only the top ~300 px show
     (the title bar and the status bar take the rest), so nothing sits below that. -->
<html><head><meta charset="utf-8"><style>
html, body { margin: 0; width: 540px; height: 380px; overflow: hidden; }
body { position: relative; background: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; }
.title { position: absolute; top: 38px; width: 100%; text-align: center; color: #1d1d1f; font-size: 18px; font-weight: 600; }
.sub { position: absolute; top: 66px; width: 100%; text-align: center; color: #6e6e73; font-size: 13px; }
.arrow { position: absolute; left: 228px; top: 178px; width: 84px; height: 24px; }
</style></head><body>
<div class="title">Mindeck installieren</div>
<div class="sub">Mindeck auf „Applications“ ziehen · Drag Mindeck to Applications</div>
<svg class="arrow" viewBox="0 0 84 24" fill="none" stroke="#a1a1a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h74"/><path d="M68 4l9 8-9 8"/></svg>
</body></html>
