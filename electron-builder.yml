# Packaging the desktop app:
#   npm run dist:mac     DMG + ZIP for Apple silicon and Intel (on a Mac)
#   npm run dist:win     one NSIS installer for x64 and arm64 (on Windows)
#   npm run dist:linux   AppImage + .deb for the machine's architecture (on Linux — node-pty is compiled there)
# Releases are built by .github/workflows/release.yml on a tag v* — see docs/RELEASE.md for its secrets:
#   MINDECK_CLOUD_URL / MINDECK_CLOUD_KEY  where Mindeck Cloud lives (baked in by electron-vite)
#   CSC_LINK / CSC_KEY_PASSWORD      "Developer ID Application" certificate (.p12, base64 or path)
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID   notarization (or APPLE_API_KEY / _ID / _ISSUER)
#   WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD   Windows code signing certificate (or Azure Trusted Signing)
#
# Artifact names never change between releases, so the website links
# releases/latest/download/<name>: Mindeck-mac-arm64.dmg, Mindeck-mac-x64.dmg, Mindeck-Setup.exe,
# Mindeck.AppImage, Mindeck.deb (Linux arm64: Mindeck-arm64.AppImage, Mindeck-arm64.deb).
appId: de.mindeck.desktop
productName: Mindeck
copyright: © 2026 Robin Hinkelmann
artifactName: ${productName}-${version}-${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
  # Bundled into the renderer by Vite — not needed again as node_modules.
  - "!node_modules/{monaco-editor,react,react-dom,framer-motion,lucide-react,@xterm,d3-force,marked,dompurify,zustand,qrcode,@fontsource,@fontsource-variable}/**"
  - "!node_modules/node-pty/{src,deps,scripts,typings,binding.gyp}/**"
  - "!**/*.{map,md,d.ts}"
  # The editor's TypeScript service needs its standard library declarations.
  - node_modules/typescript/lib/*.d.ts

# Electron's fuses, flipped in the binary before signing. Mindeck's main process can't be
# started as plain Node with NODE_OPTIONS or --inspect, its code only comes from app.asar
# and only as signed (the integrity is checked at start on macOS and Windows), and the
# browser's cookies are encrypted with the OS keychain like Chrome's (a one-way switch).
# RunAsNode off: ELECTRON_RUN_AS_NODE=1 can't turn the signed binary into a Node that inherits
# Mindeck's macOS permissions (camera, microphone, folders). Mindeck's own Node programs —
# tsserver, the lint worker, the PHP debug adapter, the Dev Containers CLI — run in Electron
# utility processes, which only the main process can start (electron/main/lib/nodeProcess.ts).
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

# node-pty ships N-API prebuilds for macOS and Windows (stable across Electron versions): nothing
# to compile. Linux has none: `npm ci` builds it there (node-gyp), and N-API keeps that build valid
# for Electron. Each platform keeps only its own prebuilds (build/afterPack.cjs).
npmRebuild: false
afterPack: build/afterPack.cjs
# The tray icon while Mindeck runs in the background (Windows/Linux): resources/tray.png.
extraResources:
  - from: build/icon.png
    to: tray.png
asarUnpack:
  - node_modules/node-pty/**
  # tsserver runs as its own Node process and reads its lib files from disk.
  - node_modules/typescript/**
  # Run as a Node program of its own (Dev Containers).
  - node_modules/@devcontainers/cli/**
  # Mindeck's Prettier, for projects without one (run by the lint worker).
  - node_modules/prettier/**

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # As electron-builder signs, but the plugin helper (utility processes that load the project's native
  # addons) gets build/entitlements.mac.plugin.plist.
  sign: build/sign.cjs
  minimumSystemVersion: '13.0'
  # The ZIPs the auto-updater downloads (latest-mac.yml lists both architectures).
  artifactName: ${productName}-mac-${arch}.${ext}
  extendInfo:
    NSHumanReadableCopyright: © 2026 Robin Hinkelmann
    # Asked once, when a website in Mindeck's browser wants them (and the user allowed that site).
    NSCameraUsageDescription: A website open in Mindeck's browser wants to use the camera.
    NSMicrophoneUsageDescription: A website open in Mindeck's browser wants to use the microphone.

dmg:
  # Same name in every release: the website links releases/latest/download/Mindeck-mac-<arch>.dmg
  artifactName: ${productName}-mac-${arch}.${ext}
  title: ${productName} ${version}
  background: build/background.png
  iconSize: 96
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 190
    - x: 400
      y: 190
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build/icon.png
  executableName: Mindeck

nsis:
  # One installer for x64 and arm64 (it installs the machine's), same name in every release:
  # releases/latest/download/Mindeck-Setup.exe
  artifactName: ${productName}-Setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ${productName}

linux:
  target:
    - target: AppImage
    - target: deb
  icon: build/icon.png
  category: Development
  executableName: mindeck
  # The window belongs to mindeck.desktop (package.json desktopName): docks group and pin it right.
  syncDesktopName: true
  synopsis: Command center for code, agents and projects
  description: Mindeck — editor, terminal, agents, memory and projects in one app.
  maintainer: Robin Hinkelmann <robin.hinkelmann@webma.one>
  desktop:
    entry:
      StartupWMClass: Mindeck

# x64 names; the arm64 build adds its architecture (-c.appImage.artifactName / -c.deb.artifactName,
# see release.yml). The .deb can't update itself: the app offers the download (UpdateService).
appImage:
  artifactName: ${productName}.${ext}

deb:
  artifactName: ${productName}.${ext}

publish:
  provider: github
  owner: robin7mh
  repo: mindeck
  releaseType: release
