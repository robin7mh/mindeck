# Merges (push to main/develop) and releases (tags v*) build and publish the
# core image — only after typecheck and unit tests pass here too: a direct push
# never reaches the public image untested (E2E stays on the pull request, ci.yml).
# The GitHub release of a tag comes from release.yml alone, once everything is built.
name: CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mindeck

permissions:
  contents: read

jobs:
  test:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      # A coverage gap only this runner shows (timing, Linux): the full report to name it (gh run download).
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/coverage-final.json
          retention-days: 7
          if-no-files-found: ignore

  # Without a baked-in cloud the server is no release build and needs no license (server/main.ts):
  # a public image like that would be the full product for free. No image, then. A tag fails: a
  # release must not go out without it. A branch goes on without an image until the cloud exists.
  cloud:
    name: Mindeck Cloud configured?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          MINDECK_CLOUD_URL: ${{ vars.MINDECK_CLOUD_URL }}
          MINDECK_CLOUD_KEY: ${{ secrets.MINDECK_CLOUD_KEY }}
        run: |
          case "$MINDECK_CLOUD_URL" in https://*) if [ -n "$MINDECK_CLOUD_KEY" ]; then echo 'ready=true' >> "$GITHUB_OUTPUT"; exit 0; fi ;; esac
          msg='Set the variable MINDECK_CLOUD_URL (https://…) and the secret MINDECK_CLOUD_KEY (docs/RELEASE.md) — without them the image would need no license'
          case "$GITHUB_REF" in
            refs/tags/*) echo "::error::$msg"; exit 1 ;;
            *) echo "::warning::No image for now. $msg" ;;
          esac

  image:
    name: Web image → GHCR
    needs: [test, cloud]
    if: needs.cloud.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # develop → :develop, main → :main, v1.2.3 → :1.2.3 :1.2 :latest, plus :sha-<short>
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          # v1.2.3-rc.1 is no :latest.
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Mindeck Cloud baked in: the published image requires a license (server/main.ts).
          build-args: |
            MINDECK_CLOUD_URL=${{ vars.MINDECK_CLOUD_URL }}
            MINDECK_CLOUD_KEY=${{ secrets.MINDECK_CLOUD_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
