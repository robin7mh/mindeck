# Keeps the pinned versions current: GitHub Actions are pinned by commit SHA
# (with the version as a comment), the Docker base images by digest — Dependabot
# proposes the new SHA/digest with the version it belongs to. One pull request a
# month with every update (actions, base images, npm), against develop like all
# other work; it reaches main with the next release.
version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: monthly
    target-branch: develop
updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
  - package-ecosystem: docker
    directories: [/, /remote]
    patterns: ['*']
    multi-ecosystem-group: dependencies
  - package-ecosystem: npm
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
